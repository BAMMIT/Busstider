name: Samla busstatistik

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub kan fördröja eller hoppa över körningar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hämta databranchen (skapas första gången)
        run: |
          set -e
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data "$URL" data-repo
          else
            mkdir data-repo && cd data-repo
            git init -q -b data
            git remote add origin "$URL"
          fi

      - name: Samla in
        env:
          TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}
          DATA_DIR: data-repo/data
          ITERATIONS: '9'
          INTERVAL_SEC: '60'
          KEEP_DAYS: '60'
        run: node code/collector/collect.mjs

      - name: Spara på databranchen (historiken skrivs över så repot inte växer)
        run: |
          set -e
          cd data-repo
          git config user.name "busstider-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git rev-parse HEAD >/dev/null 2>&1; then
            git commit --amend --allow-empty -q -m "Data $(date -u +%FT%TZ)"
          else
            git commit --allow-empty -q -m "Data $(date -u +%FT%TZ)"
          fi
          git push --force origin data
