<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bammit</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="webben.css" />
</head>

<body>

<header class="navbar">
  <div class="container nav-content">
    <div class="logo">BAMMIT</div>

    <nav id="nav-menu">
      <a href="#home">Hem</a>
      <a href="#about">Paket</a>
      <a href="blog.html">Blogg</a>
      <a href="#contact">Contact</a>
    </nav>

    <button id="menu-toggle" class="menu-toggle">☰</button>
  </div>
</header>

<section id="home" class="hero reveal">
  <div class="container">
    <h1>Välkommen till <span class="text-gradient">Bekvämligheten</span></h1>
    <p>Vi hjälper dig med att förenkla din vardag</p>
  </div>
</section>

<section id="about" class="about reveal">
  <div class="container">
    <h2>Våra Paket</h2>

    <div class="card-grid">
      <div class="card"><h3>Bas</h3></div>
      <div class="card"><h3>Plus</h3></div>
      <div class="card"><h3>Timbank</h3></div>
    </div>
  </div>
</section>

<!-- BLOG (3 senaste) -->
<section class="blog reveal">
  <div class="container">
    <h2>Senaste inlägg</h2>

    <div id="latest-posts" class="card-grid"></div>

    <br>
    <a href="blog.html">Se alla inlägg →</a>
  </div>
</section>

<section id="contact" class="contact reveal">
  <div class="container">
    <h2>Contact</h2>

    <form>
      <input type="text" placeholder="Namn">
      <input type="email" placeholder="Email">
      <textarea placeholder="Meddelande"></textarea>
      <button class="btn-primary">Skicka</button>
    </form>
  </div>
</section>

<footer class="footer">
  <div class="container footer-content">
    <div>
      <h3>BAMMIT</h3>
      <p>SQL Server - Lite enklare</p>
    </div>

    <div>
      <p>info@bammit.se</p>
      <p>070-1234567</p>
    </div>
  </div>
</footer>

<script>
// MENU
const toggle = document.getElementById("menu-toggle");
const nav = document.getElementById("nav-menu");

toggle.addEventListener("click", () => {
  nav.classList.toggle("active");
});

// SCROLL ANIMATION
const reveals = document.querySelectorAll(".reveal");

const revealOnScroll = () => {
  reveals.forEach(el => {
    const top = el.getBoundingClientRect().top;
    if (top < window.innerHeight - 80) {
      el.classList.add("active");
    }
  });
};

window.addEventListener("scroll", revealOnScroll);
revealOnScroll();

// BLOG (3 senaste)
fetch('blog.json')
  .then(res => res.json())
  .then(data => {

    data.sort((a, b) => new Date(b.date) - new Date(a.date));
    const latest = data.slice(0, 3);

    const container = document.getElementById("latest-posts");

    latest.forEach(post => {
      container.innerHTML += `
        <div class="card">
          <h3>${post.title}</h3>
          <p>${post.excerpt}</p>
          <small>${post.date}</small>
        </div>
      `;
    });

  });
</script>

</body>
</html>
